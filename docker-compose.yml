# Limite de tamanho dos logs de stdout/stderr dos containers (driver json-file).
# Evita que /var/lib/docker/containers/*/*-json.log cresça sem limite: o gunicorn
# corre com '--access-logfile -' (ver Dockerfile), pelo que todos os acessos vão
# para stdout e são capturados pelo Docker.
#
# Definido aqui, e não só no /etc/docker/daemon.json, para não depender da
# configuracao do host: o default global do daemon só se aplica a containers
# criados depois de um restart do daemon.
x-logging: &default-logging
  driver: json-file
  options:
    max-size: "50m"
    max-file: "5"

services:
  # PostgREST for real Hydra database (used for development with real data)
  postgrest:
    image: 'postgrest/postgrest:v14.3'
    logging: *default-logging
    environment:
      # Connect to Hydra CSV database
      - PGRST_DB_URI=postgres://postgres:postgres@host.docker.internal:5434/postgres
      - PGRST_SERVER_PORT=${PGREST_PORT:-8080}
      - PGRST_DB_ANON_ROLE=postgres
      # Expor os dois schemas: 'public' (dados tabular, schema por defeito) e 'metric' (métricas).
      # A metrics-api seleciona o schema 'metric' via header Accept-Profile; a tabular-api usa o default (public).
      - PGRST_DB_SCHEMA=public,metric
      - PGRST_DB_AGGREGATES_ENABLED=true
    ports:
      - "${PGREST_PORT:-8080}:${PGREST_PORT:-8080}"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    profiles:
      - hydra

  # PostgREST for test database (used for running tests)
  postgrest-test:
    image: "postgrest/postgrest:v14.0"
    logging: *default-logging
    environment:
      # connect to hydra database-csv
      - PGRST_DB_URI=postgres://csvapi:csvapi@postgres-test:5432/csvapi
      - p=http://127.0.0.1:8080
      - PGRST_SERVER_PORT=8080
      - PGRST_DB_ANON_ROLE=csvapi
      - PGRST_DB_SCHEMA=csvapi
      - PGRST_DB_AGGREGATES_ENABLED=true
    ports:
      - 8080:8080
    depends_on:
      - postgres-test
    profiles:
      - test

  # Test database (used for running tests)
  postgres-test:
    image: "postgres:15"
    logging: *default-logging
    volumes:
      - ./db/initdb/:/docker-entrypoint-initdb.d/
      - ./db/tables_index.csv:/tmp/tables_index.csv
      - ./db/exceptions.csv:/tmp/exceptions.csv
    environment:
      - POSTGRES_DB=csvapi
      - POSTGRES_USER=csvapi
      - POSTGRES_PASSWORD=csvapi
    profiles:
      - test

  # Tabular API (run locally via Docker, uses same Dockerfile as CI)
  tabular-api:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        APP_MODULE: api_tabular.tabular.app:app_factory
    logging: *default-logging
    ports:
      - "8005:8005"
    environment:
      - PGREST_ENDPOINT=http://postgrest:8080
      - PAGE_SIZE_MAX=200
    depends_on:
      - postgrest
    profiles:
      - hydra

  # Metrics API (run locally via Docker, uses same Dockerfile as CI)
  metrics-api:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        APP_MODULE: api_tabular.metrics.app:app_factory
    logging: *default-logging
    ports:
      - "8006:8005"
    environment:
      - PGREST_ENDPOINT=http://postgrest:8080
      - PAGE_SIZE_MAX=200
    depends_on:
      - postgrest
    profiles:
      - hydra

